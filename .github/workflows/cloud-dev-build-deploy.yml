name: Build and Deploy to Isolated Development Server

on:
  push:
    branches:
      - develop
      # Bootstrap only: verify the isolated connection before merging to develop.
      - codex/development-deployment-isolation
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the development connection without building or replacing apps
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# One deployment at a time; do not interrupt rollback or health checks.
concurrency:
  group: cloud-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  DEV_INSTANCE_ID: i-0eb11976c412eb88b
  DEV_DEPLOY_ROLE: arn:aws:iam::792854191046:role/aics-pr-test-github-deploy

jobs:
  verify-development-target:
    runs-on: ubuntu-latest
    environment: pr-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment script behavior
        run: |
          bash -n scripts/deploy-development.sh scripts/run-development-command.sh
          scripts/test-deploy-development.sh
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.DEV_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '792854191046'
          role-session-name: aics-dev-check-${{ github.run_id }}
      - name: Verify fixed development target without changing services
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: scripts/run-development-command.sh check "$DEPLOY_SHA"

  build-docker-image:
    needs: verify-development-target
    if: github.event_name == 'push' || !inputs.verify_only
    runs-on: ubuntu-latest
    environment: pr-test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, auth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build application
        env:
          APP: ${{ matrix.app }}
        run: ./gradlew ":aics-$APP:bootJar" -x test
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.DEV_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '792854191046'
          role-session-name: aics-dev-build-${{ matrix.app }}-${{ github.run_id }}
      - name: Publish immutable development image to private ECR
        env:
          APP: ${{ matrix.app }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry=792854191046.dkr.ecr.ap-northeast-2.amazonaws.com
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$registry"
          image="$registry/aics-pr-test/aics-$APP:dev-$DEPLOY_SHA"
          docker build -t "$image" -f "aics-$APP/Dockerfile" .
          docker push "$image"

  deploy-to-dev:
    needs: [verify-development-target, build-docker-image]
    timeout-minutes: 50
    runs-on: ubuntu-latest
    environment: pr-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.DEV_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '792854191046'
          role-session-name: aics-dev-deploy-${{ github.run_id }}
      - name: Replace development apps and wait for health checks
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: scripts/run-development-command.sh deploy "$DEPLOY_SHA"
      - name: Verify public development HTTPS
        run: |
          set -euo pipefail
          for route in /swagger-ui/index.html /v3/api-docs /auth-api-docs /admin-api-docs; do
            curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
              --max-time 10 --fail --silent --show-error --output /dev/null \
              "https://api.dev.kgudevelopers.monster$route"
          done
