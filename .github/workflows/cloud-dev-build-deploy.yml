name: Build and Deploy to Development Server on Cloud

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# KD3-170: 이 워크플로의 실행 자체가 겹치면(#121, #128 배포에서 실제로 5분 이상
# 동시 실행됨) 두 실행이 동시에 stop/rm/up을 수행할 수 있어 컨테이너 이름 충돌이
# 재발한다. 배포를 한 번에 하나씩만 진행하도록 워크플로 단위로 직렬화한다.
concurrency:
  group: cloud-dev-deployment
  cancel-in-progress: false

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    environment: cloud-dev

    steps:
      - name: get repo from github
        uses: actions/checkout@v4

      # JDK setting
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle 빌드
      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: |
          ./gradlew clean build -p aics-admin -x test
          ./gradlew clean build -p aics-api -x test
          ./gradlew clean build -p aics-auth -x test

      # DockerHub 로그인
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Docker 이미지 빌드
      - name: Docker image build for aics-admin
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }} -f aics-admin/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:latest

      - name: Docker image build for aics-api
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }} -f aics-api/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:latest

      - name: Docker image build for aics-auth
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }} -f aics-auth/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:latest

      # Docker Hub 이미지 푸시
      - name: docker Hub push for aics-admin
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:latest

      - name: docker Hub push for aics-api
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:latest

      - name: docker Hub push for aics-auth
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:latest

  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build-docker-image
    environment: cloud-dev

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: scp docker-compose and Caddyfile to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker/development/docker-compose.yml, docker/development/pgadmin-servers.json, caddy/development/Caddyfile"
          target: ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
          strip_components: 2

      - name: ssh to server and deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
            export IMAGE_TAG=${{ github.sha }}

            # KD3-170 후속(sunzx0428 리뷰 09-06): 새 이미지 자체가 망가져서(재시도로
            # 해결 안 되는 종류) 기동에 실패하면, 기존 컨테이너를 이미 지운 뒤라 세
            # 서비스가 전부 내려간 채로 끝날 수 있었다. 직전에 정상 기동을 확인했던
            # 이미지 태그를 마커 파일로 남겨두고, 이번 배포가 끝까지 실패하면 그
            # 태그로 되돌린다.
            LAST_GOOD_TAG_FILE=.last-successful-image-tag
            PREVIOUS_IMAGE_TAG=""
            if [ -f "$LAST_GOOD_TAG_FILE" ]; then
              PREVIOUS_IMAGE_TAG=$(cat "$LAST_GOOD_TAG_FILE")
            fi

            rollback_to_previous_image() {
              if [ -z "$PREVIOUS_IMAGE_TAG" ]; then
                echo "롤백할 이전 이미지 태그가 없습니다(첫 배포이거나 기록이 없음)." >&2
                return 1
              fi
              echo "이전 이미지($PREVIOUS_IMAGE_TAG)로 되돌립니다." >&2
              docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} stop aics-api aics-admin aics-auth
              docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} rm -f aics-api aics-admin aics-auth
              IMAGE_TAG="$PREVIOUS_IMAGE_TAG" \
                docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} up -d
            }

            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} pull

            # KD3-170: "docker compose up -d" 한 번에 재생성을 맡기면, 기존 컨테이너를
            # 멈추고 지우는 것과 새 컨테이너에 원래 이름을 붙이는 것 사이에 타이밍 레이스가
            # 생겨 "컨테이너 이름 충돌"로 배포가 실패하는 경우가 반복됐다(#106, #128, #132
            # 배포 때 실제로 겪음 — 재현할 때마다 서버에 직접 들어가 멈춰있는 컨테이너를
            # 수동으로 지워야 했음). stop/rm을 명시적인 별도 명령으로 분리하면 각 명령이
            # 끝날 때까지 확실히 기다린 뒤 다음 단계로 넘어가므로 이 레이스 자체가 없어진다.
            # postgres/redis/caddy/pgadmin은 매번 재시작할 필요가 없어 대상에서 제외한다.
            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} stop aics-api aics-admin aics-auth
            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} rm -f aics-api aics-admin aics-auth

            # KD3-170: up -d 가 일시적인 Docker 오류로 실패하면 set -e 로 바로
            # 스크립트가 종료되어 애플리케이션 컨테이너가 없는 상태로 남는다.
            # 일시적 실패에 한해 제한된 횟수로 재시도한다.
            up_attempt=1
            until docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} up -d; do
              if [ "$up_attempt" -ge 5 ]; then
                echo "docker compose up 실패 (재시도 $up_attempt회 초과)." >&2
                docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} ps
                rollback_to_previous_image || true
                exit 1
              fi

              echo "docker compose up 실패, 재시도합니다. ($up_attempt/5)"
              up_attempt=$((up_attempt + 1))
              sleep 5
            done

            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            reload_attempt=1
            until docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; do
              if [ "$reload_attempt" -ge 10 ]; then
                echo "Caddy reload failed after $reload_attempt attempts." >&2
                exit 1
              fi

              echo "Caddy admin API is not ready. Retrying reload ($reload_attempt/10)..."
              reload_attempt=$((reload_attempt + 1))
              sleep 1
            done

            health_attempt=1
            until docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              wget -q -O /dev/null http://aics-api:8080/v3/api-docs \
              && docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
                wget -q -O /dev/null http://aics-admin:8081/admin-api-docs \
              && docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
                wget -q -O /dev/null http://aics-auth:8082/auth-api-docs; do
              if [ "$health_attempt" -ge 90 ]; then
                # 실패한 컨테이너의 상세 로그(docker compose logs)는 여기서 GitHub Actions
                # 로그로 직접 찍지 않는다 — 애플리케이션 로그에 토큰·개인정보·환경값이 섞여
                # 있으면 팀 전체가 보는 CI 로그에 그대로 노출될 위험이 있다(sunzx0428 리뷰
                # 09-06). 상태 확인은 ps로 제한하고, 상세 로그는 KD3-168로 이미 컨테이너
                # 밖에 파일로 남고 있으니(docker/logs/) 필요하면 서버에 직접 들어가서 본다.
                echo "애플리케이션 기동 확인에 실패했습니다." >&2
                docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} ps
                rollback_to_previous_image || true
                exit 1
              fi

              echo "애플리케이션 기동을 기다립니다. ($health_attempt/90)"
              health_attempt=$((health_attempt + 1))
              sleep 2
            done

            echo "API, Admin, Auth 애플리케이션 기동 확인을 완료했습니다."
            echo "$IMAGE_TAG" > "$LAST_GOOD_TAG_FILE"

            echo "이미지 정리 전 디스크 사용량:"
            df -h .
            docker image prune -af
            echo "이미지 정리 후 디스크 사용량:"
            df -h .
