name: Build and Deploy to Development Server on Cloud

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    environment: cloud-dev

    steps:
      - name: get repo from github
        uses: actions/checkout@v4

      # JDK setting
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle 빌드
      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: |
          ./gradlew clean build -p aics-admin -x test
          ./gradlew clean build -p aics-api -x test
          ./gradlew clean build -p aics-auth -x test

      # DockerHub 로그인
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Docker 이미지 빌드
      - name: Docker image build for aics-admin
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }} -f aics-admin/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:latest

      - name: Docker image build for aics-api
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }} -f aics-api/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:latest

      - name: Docker image build for aics-auth
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }} -f aics-auth/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:latest

      # Docker Hub 이미지 푸시
      - name: docker Hub push for aics-admin
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-admin:latest

      - name: docker Hub push for aics-api
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-api:latest

      - name: docker Hub push for aics-auth
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aics-auth:latest

  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build-docker-image
    environment: cloud-dev

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: scp docker-compose and Caddyfile to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker/development/docker-compose.yml, docker/development/pgadmin-servers.json, caddy/development/Caddyfile"
          target: ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
          strip_components: 2

      - name: ssh to server and deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
            export IMAGE_TAG=${{ github.sha }}

            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} pull
            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} up -d
            docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            reload_attempt=1
            until docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; do
              if [ "$reload_attempt" -ge 10 ]; then
                echo "Caddy reload failed after $reload_attempt attempts." >&2
                exit 1
              fi

              echo "Caddy admin API is not ready. Retrying reload ($reload_attempt/10)..."
              reload_attempt=$((reload_attempt + 1))
              sleep 1
            done

            health_attempt=1
            until docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
              wget -q -O /dev/null http://aics-api:8080/v3/api-docs \
              && docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
                wget -q -O /dev/null http://aics-admin:8081/admin-api-docs \
              && docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} exec -T caddy \
                wget -q -O /dev/null http://aics-auth:8082/auth-api-docs; do
              if [ "$health_attempt" -ge 90 ]; then
                echo "애플리케이션 기동 확인에 실패했습니다." >&2
                docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} ps
                docker compose --env-file ${{ secrets.ENVIRONMENT_PATH }} logs \
                  --tail=200 aics-api aics-admin aics-auth
                exit 1
              fi

              echo "애플리케이션 기동을 기다립니다. ($health_attempt/90)"
              health_attempt=$((health_attempt + 1))
              sleep 2
            done

            echo "API, Admin, Auth 애플리케이션 기동 확인을 완료했습니다."

            echo "이미지 정리 전 디스크 사용량:"
            df -h .
            docker image prune -af
            echo "이미지 정리 후 디스크 사용량:"
            df -h .
