name: Server Preflight

# 서버를 GitHub Environment 에 연결한 뒤, 배포를 시도해도 되는 기본 준비가 됐는지 "읽기만 하며" 점검하는 워크플로다.
# Actions 탭에서 직접 실행(workflow_dispatch)하고, 점검할 환경(cloud-dev 또는 cloud-prod)을 고른다.
#
# 서버를 새로 붙이는 사람은 아래 순서로 하면 된다.
#   1) 환경의 시크릿 6개(SERVER_HOST, SERVER_PORT, SERVER_USERNAME, SSH_PRIVATE_KEY,
#      DOCKER_COMPOSE_YAML_PATH, ENVIRONMENT_PATH)를 입력한다.
#   2) 이 워크플로를 실행한다.
#   3) [FAIL] 이 없어야 한다. [WARN] 은 반드시 읽고 판단한다. 80/443 포트를 다른 스택이 쓰고 있다는 안내처럼
#      "누가 쓰고 있는지"를 알려 주는 항목은 FAIL 0 이어도 인계·정리가 필요한지 확인해야 한다.
#      이 점검은 서버의 기본 준비 상태만 보므로, 앱이 실제로 뜨는지는 배포와 스모크 테스트가 확인한다.
#
# 서버에는 아무것도 쓰거나 바꾸지 않는다(파일 읽기와 상태 조회만, 임시 파일은 점검이 끝나면 지운다).
# 비밀 값은 출력하지 않고 키 "이름"만 출력한다. 명령의 오류 원문은 값이 섞일 수 있어 출력하지 않는다.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 점검할 GitHub Environment
        type: choice
        required: true
        options:
          - cloud-dev
          - cloud-prod

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    # 환경을 지정해야 그 환경의 시크릿을 읽는다. 환경에 승인자(Required reviewers)가 있으면 실행 전에 승인을 기다린다.
    environment: ${{ inputs.environment }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: 1. 시크릿 6개가 모두 들어 있는지 확인
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOCKER_COMPOSE_YAML_PATH: ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
          ENVIRONMENT_PATH: ${{ secrets.ENVIRONMENT_PATH }}
        run: |
          set -u
          missing=()
          for name in SERVER_HOST SERVER_PORT SERVER_USERNAME SSH_PRIVATE_KEY DOCKER_COMPOSE_YAML_PATH ENVIRONMENT_PATH; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::환경 '${{ inputs.environment }}' 에 없는 시크릿: ${missing[*]}"
            exit 1
          fi

          # 형식 점검. 값 자체는 출력하지 않는다.
          bad=0
          if ! [[ "$SERVER_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SERVER_PORT 는 숫자여야 합니다(보통 22)."; bad=1
          fi
          case "$DOCKER_COMPOSE_YAML_PATH" in /*) ;; *) echo "::error::DOCKER_COMPOSE_YAML_PATH 는 / 로 시작하는 절대 경로여야 합니다."; bad=1 ;; esac
          case "$ENVIRONMENT_PATH" in /*) ;; *) echo "::warning::ENVIRONMENT_PATH 가 절대 경로가 아닙니다. compose 폴더 기준 상대 경로로 해석됩니다." ;; esac
          if ! printf '%s' "$SSH_PRIVATE_KEY" | head -1 | grep -q 'PRIVATE KEY'; then
            echo "::error::SSH_PRIVATE_KEY 가 개인키 형식이 아닙니다. '-----BEGIN ... PRIVATE KEY-----' 줄부터 '-----END ... PRIVATE KEY-----' 줄까지 전체를 넣어야 합니다."; bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "시크릿 6개가 모두 있고 형식이 올바릅니다."

      - name: 2. GitHub 러너에서 서버의 SSH 포트에 닿는지 확인
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          # GitHub 러너는 IP 가 계속 바뀐다. 서버의 보안그룹이 특정 IP 에서만 SSH 를 허용하면 여기서 막힌다.
          # (SSH 로 배포하는 이 프로젝트에서는 러너에서 SSH 포트가 열려 있어야 한다.)
          # 호스트와 포트는 bash -c 의 "문자열"에 끼워 넣지 않고 인자($1, $2)로 넘긴다. 문자열에 넣으면 값 안의 특수문자가
          # 셸에서 다시 해석된다.
          if timeout 15 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "${SERVER_HOST}" "${SERVER_PORT}" 2>/dev/null; then
            echo "SSH 포트에 연결됩니다."
          else
            echo "::error::GitHub 러너에서 서버의 SSH 포트에 연결할 수 없습니다. 서버 보안그룹(방화벽)이 모든 IP(또는 GitHub 러너 대역)에서 SSH 포트를 허용하는지, SERVER_PORT 가 서버의 실제 SSH 포트인지 확인하세요."
            exit 1
          fi

      - name: 3. 서버 변수 목록을 compose 파일에서 읽기
        id: keys
        run: |
          # compose 가 쓰는 변수 중 기본값이 없는 것은 서버의 .env 에 있어야 하고(필수),
          # 기본값(${VAR:-값})이 있는 것은 없어도 동작한다(선택). 파일에서 직접 읽어 변수가 늘어도 어긋나지 않게 한다.
          file=docker/development/docker-compose.yml
          required=$(grep -oE '\$\{[A-Z0-9_]+\}' "$file" | tr -d '${}' | sort -u | tr '\n' ' ')
          optional=$(grep -oE '\$\{[A-Z0-9_]+:-' "$file" | sed -E 's/^\$\{//; s/:-$//' | sort -u | tr '\n' ' ')
          echo "필수: $required"
          echo "선택: $optional"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "optional=$optional" >> "$GITHUB_OUTPUT"

      - name: 4. 서버 상태 점검(읽기 전용)
        uses: appleboy/ssh-action@v1.1.0
        env:
          TARGET_ENV: ${{ inputs.environment }}
          COMPOSE_DIR: ${{ secrets.DOCKER_COMPOSE_YAML_PATH }}
          ENV_FILE: ${{ secrets.ENVIRONMENT_PATH }}
          REQUIRED_KEYS: ${{ steps.keys.outputs.required }}
          OPTIONAL_KEYS: ${{ steps.keys.outputs.optional }}
          # 운영 승격 검증(promote-to-production.yml)이 이미지를 확인하는 Docker Hub 사용자명. 서버가 이미지를 받아 오는
          # 사용자명(.env 의 DOCKERHUB_USERNAME)과 같아야 한다.
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'hotan35' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: TARGET_ENV,COMPOSE_DIR,ENV_FILE,REQUIRED_KEYS,OPTIONAL_KEYS,DOCKERHUB_NAMESPACE
          script: |
            set -u
            FAILS=0
            WARNS=0
            pass() { echo "[PASS] $*"; }
            info() { echo "[INFO] $*"; }
            warn() { echo "[WARN] $*"; WARNS=$((WARNS + 1)); }
            fail() { echo "[FAIL] $*"; FAILS=$((FAILS + 1)); }

            echo "=== 점검 대상: ${TARGET_ENV} ($(whoami)@$(hostname)) ==="
            pass "SSH 접속과 인증에 성공했습니다."

            echo
            echo "--- Docker ---"
            DOCKER_OK=0
            if command -v docker >/dev/null 2>&1; then
              pass "docker 가 설치돼 있습니다 ($(docker --version 2>/dev/null))."
              if docker info >/dev/null 2>&1; then
                pass "현재 사용자가 sudo 없이 docker 를 쓸 수 있습니다."
                DOCKER_OK=1
              else
                fail "docker 데몬에 접근할 수 없습니다. 데몬이 실행 중인지, 접속 사용자가 docker 그룹에 속하는지 확인하세요(sudo usermod -aG docker \$USER 후 재접속)."
              fi
              if docker compose version >/dev/null 2>&1; then
                pass "docker compose 를 쓸 수 있습니다 ($(docker compose version --short 2>/dev/null))."
              else
                fail "docker compose 플러그인이 없습니다."
                DOCKER_OK=0
              fi
            else
              fail "docker 가 설치돼 있지 않습니다."
            fi

            echo
            echo "--- 경로 ---"
            if [ -d "$COMPOSE_DIR" ]; then
              pass "compose 폴더가 있습니다: $COMPOSE_DIR"
              if [ -w "$COMPOSE_DIR" ]; then
                pass "compose 폴더에 쓸 수 있습니다(배포 때 설정 파일을 복사합니다)."
              else
                fail "compose 폴더에 쓸 수 없습니다. 접속 사용자 소유인지 확인하세요."
              fi
            else
              fail "compose 폴더가 없습니다: $COMPOSE_DIR (배포 첫 단계가 이 폴더로 cd 하므로 미리 만들어야 합니다: mkdir -p $COMPOSE_DIR)"
            fi

            case "$ENV_FILE" in
              /*) RESOLVED_ENV="$ENV_FILE" ;;
              *) RESOLVED_ENV="$COMPOSE_DIR/$ENV_FILE" ;;
            esac

            if [ -f "$RESOLVED_ENV" ]; then
              pass ".env 파일이 있습니다: $RESOLVED_ENV"
              if [ ! -r "$RESOLVED_ENV" ]; then
                fail ".env 파일을 읽을 수 없습니다."
              else
                # 소유자 외(그룹·기타)가 읽거나 쓸 수 있으면 경고한다. 비밀번호와 키가 들어 있는 파일이다.
                perm=$(stat -c %a "$RESOLVED_ENV" 2>/dev/null || stat -f %Lp "$RESOLVED_ENV" 2>/dev/null || echo "")
                if [ -n "$perm" ] && [ $(( 8#$perm & 8#077 )) -ne 0 ]; then
                  warn ".env 의 권한이 $perm 입니다. 소유자 외의 사용자도 접근할 수 있으니 chmod 600 을 권장합니다."
                fi

                echo
                echo "--- .env 필수 키(이름과 상태만 점검, 값은 출력하지 않습니다) ---"
                # .env 의 따옴표·인라인 주석·export 같은 해석 규칙은 Docker Compose 버전마다 조금씩 달라서 직접 흉내 내지 않고,
                # 서버의 Compose 에게 맡긴다. 키마다 "[값]" 형태로 치환해 보고 비어 있는지만 판단한다(값은 출력하지 않는다).
                # 임시 파일은 무작위 이름의 전용 폴더에 만들고 바로 지운다. 셸 환경변수는 쓰지 않도록 env -i 로 실행한다.
                probe_out=""
                if [ "$DOCKER_OK" = "1" ]; then
                  probe_dir=$(mktemp -d 2>/dev/null) || probe_dir=""
                  if [ -n "$probe_dir" ]; then
                    {
                      echo "name: preflight"
                      echo "services:"
                      echo "  probe:"
                      echo "    image: probe"
                      echo "    environment:"
                      for key in $REQUIRED_KEYS; do
                        echo "      $key: \"[\${$key}]\""
                      done
                    } > "$probe_dir/probe.yml"
                    probe_out=$(env -i PATH="$PATH" HOME="${HOME:-/}" docker compose -f "$probe_dir/probe.yml" --env-file "$RESOLVED_ENV" config 2>/dev/null) || probe_out=""
                    rm -rf "$probe_dir"
                  fi
                fi

                # Compose 가 읽은 키의 값(앞뒤 공백 제거). 판단에만 쓰고 출력하지 않는다.
                key_inner() {
                  local raw inner
                  raw=$(printf '%s\n' "$probe_out" | sed -n "s/^[[:space:]]*${1}:[[:space:]]*//p" | head -1)
                  inner=${raw#[\'\"]}; inner=${inner%[\'\"]}; inner=${inner#\[}; inner=${inner%\]}
                  inner=${inner#"${inner%%[![:space:]]*}"}; inner=${inner%"${inner##*[![:space:]]}"}
                  printf '%s' "$inner"
                }

                # 키의 상태: missing(.env 에 줄이 없음) | empty(비어 있음) | hash(값이 # 로 시작) | set
                key_state() {
                  local key=$1 inner
                  if ! grep -qE "^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=" "$RESOLVED_ENV"; then
                    echo missing
                    return
                  fi
                  inner=$(key_inner "$key")
                  if [ -z "$inner" ]; then
                    echo empty
                  elif [ "${inner#\#}" != "$inner" ]; then
                    echo hash
                  else
                    echo set
                  fi
                }

                if [ -z "$probe_out" ]; then
                  if [ "$DOCKER_OK" = "1" ]; then
                    fail "docker compose 로 .env 를 해석하지 못했습니다(.env 형식 오류일 수 있습니다). 키 점검을 건너뜁니다."
                  else
                    info "docker 를 쓸 수 없어 .env 키 값을 점검하지 못했습니다(위 docker 항목을 먼저 해결하세요)."
                  fi
                else
                  # S3 자격 증명 두 키는 "정적 키 쌍" 또는 "서버의 EC2 IAM 역할" 중 하나면 된다(앱이 키가 비어 있으면 IAM 역할을 쓴다).
                  # 그래서 아래의 일반 필수 키 점검에서는 빼고 따로 판정한다.
                  S3_STATIC_KEYS="AWS_S3_ACCESS_KEY AWS_S3_SECRET_KEY"
                  checked=0
                  problem_keys=0
                  for key in $REQUIRED_KEYS; do
                    case " $S3_STATIC_KEYS " in *" $key "*) continue ;; esac
                    checked=$((checked + 1))
                    case "$(key_state "$key")" in
                      missing)
                        fail "필수 키가 없습니다: $key"
                        problem_keys=$((problem_keys + 1)) ;;
                      empty)
                        fail "필수 키의 값이 비어 있습니다: $key"
                        problem_keys=$((problem_keys + 1)) ;;
                      hash)
                        warn "$key 의 값이 '#' 로 시작합니다. 주석으로 쓰려던 것이 값으로 읽혔을 수 있으니 확인하세요(값은 출력하지 않습니다)." ;;
                    esac
                  done
                  if [ "$problem_keys" -eq 0 ]; then
                    pass "필수 키 ${checked}개가 모두 있고 값이 비어 있지 않습니다."
                  fi

                  # 서버가 이미지를 받아 오는 Docker Hub 사용자명(.env 의 DOCKERHUB_USERNAME)이, 운영 승격 검증이 이미지를 확인하는
                  # 사용자명(DOCKERHUB_NAMESPACE)과 같아야 한다. 다르면 승격은 A 저장소의 이미지를 검증했는데 서버는 B 저장소의
                  # 같은 태그를 받게 된다. 서버 쪽 값은 출력하지 않는다.
                  if [ -n "${DOCKERHUB_NAMESPACE:-}" ] && [ "$(key_state DOCKERHUB_USERNAME)" = "set" ]; then
                    if [ "$(key_inner DOCKERHUB_USERNAME)" = "$DOCKERHUB_NAMESPACE" ]; then
                      pass "DOCKERHUB_USERNAME 이 승격 검증의 Docker Hub 사용자명(DOCKERHUB_NAMESPACE=${DOCKERHUB_NAMESPACE})과 같습니다."
                    else
                      fail "서버 .env 의 DOCKERHUB_USERNAME 이 승격 검증의 Docker Hub 사용자명(DOCKERHUB_NAMESPACE=${DOCKERHUB_NAMESPACE})과 다릅니다. 서버가 받아 오는 이미지와 승격이 검증하는 이미지가 서로 다른 저장소가 됩니다. 값을 맞추거나 저장소 변수 DOCKERHUB_NAMESPACE 를 서버 값으로 지정하세요."
                    fi
                  fi

                  s3_access=$(key_state AWS_S3_ACCESS_KEY)
                  s3_secret=$(key_state AWS_S3_SECRET_KEY)
                  s3_access_set=0; s3_secret_set=0
                  case "$s3_access" in set|hash) s3_access_set=1 ;; esac
                  case "$s3_secret" in set|hash) s3_secret_set=1 ;; esac
                  if [ "$s3_access_set" = "1" ] && [ "$s3_secret_set" = "1" ]; then
                    pass "S3 자격 증명: .env 의 정적 키 쌍을 씁니다."
                  elif [ "$s3_access_set" = "1" ] || [ "$s3_secret_set" = "1" ]; then
                    fail "S3 자격 증명: AWS_S3_ACCESS_KEY 와 AWS_S3_SECRET_KEY 는 둘 다 있거나 둘 다 없어야 합니다(쌍이 맞지 않습니다)."
                  else
                    # 둘 다 없으면 앱이 EC2 IAM 역할(기본 자격 증명 체인)로 S3 에 접근한다. 서버에 역할이 연결돼 있는지만 확인한다.
                    iam_role=""
                    if command -v curl >/dev/null 2>&1; then
                      imds_token=$(curl -s -m 3 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' 2>/dev/null || true)
                      iam_role=$(curl -s -m 3 -H "X-aws-ec2-metadata-token: ${imds_token}" http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>/dev/null | head -1 || true)
                      if printf '%s' "$iam_role" | grep -qiE '<|error|not found'; then iam_role=""; fi
                    fi
                    if [ -n "$iam_role" ]; then
                      pass "S3 자격 증명: .env 에 정적 키가 없어 서버의 IAM 역할(${iam_role})을 씁니다. 그 역할에 S3 버킷 접근 권한이 있는지는 확인하지 않습니다."
                    else
                      fail "S3 자격 증명: .env 에 정적 키가 없고 서버에 IAM 역할도 확인되지 않습니다. AWS_S3_ACCESS_KEY·AWS_S3_SECRET_KEY 를 넣거나 서버에 IAM 역할을 연결하세요."
                    fi
                  fi
                fi

                absent=""
                for key in $OPTIONAL_KEYS; do
                  if ! grep -qE "^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=" "$RESOLVED_ENV"; then
                    absent="$absent $key"
                  fi
                done
                if [ -n "$absent" ]; then
                  info "선택 키 중 없는 것(기본값이 쓰입니다):$absent"
                  if [ "$TARGET_ENV" = "cloud-dev" ]; then
                    case "$absent" in
                      *CORS_ALLOWED_ORIGINS*|*CSRF_COOKIE_DOMAIN*)
                        warn "개발 서버인데 CORS_ALLOWED_ORIGINS 또는 CSRF_COOKIE_DOMAIN 이 없습니다. 기본값은 운영 도메인(kgudevelopers.monster) 기준이라 개발 서버에서는 개발 도메인에 맞게 지정해야 합니다."
                        ;;
                    esac
                  fi
                fi
              fi

              if [ -f "$COMPOSE_DIR/docker-compose.yml" ] && [ "$DOCKER_OK" = "1" ]; then
                # 오류 원문에는 치환된 .env 값이 섞일 수 있어 파일에 저장하거나 출력하지 않고 성공/실패만 본다.
                if (cd "$COMPOSE_DIR" && docker compose --env-file "$RESOLVED_ENV" config -q) >/dev/null 2>&1; then
                  pass "서버의 docker-compose.yml 이 .env 와 함께 올바르게 해석됩니다."
                else
                  fail "docker compose 설정 검증에 실패했습니다. 오류 원문에는 .env 값이 섞일 수 있어 출력하지 않습니다. 서버에서 직접 확인하세요: cd $COMPOSE_DIR && docker compose --env-file $RESOLVED_ENV config -q"
                fi
              else
                info "서버에 docker-compose.yml 이 아직 없습니다(첫 배포 때 복사됩니다)."
              fi
            else
              fail ".env 파일이 없습니다: $RESOLVED_ENV (ENVIRONMENT_PATH 값과 실제 위치가 같은지 확인하세요)"
            fi

            echo
            echo "--- 네트워크와 자원 ---"
            if command -v curl >/dev/null 2>&1; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://registry-1.docker.io/v2/ 2>/dev/null || echo "000")
              if [ "$code" = "401" ] || [ "$code" = "200" ]; then
                pass "서버에서 Docker Hub 에 접근할 수 있습니다(이미지를 받아 올 수 있음)."
              else
                fail "서버에서 Docker Hub 에 접근할 수 없습니다(응답 코드 $code). 서버의 아웃바운드 통신을 확인하세요."
              fi
            else
              warn "curl 이 없어 Docker Hub 접근을 확인하지 못했습니다."
            fi

            usage=$(df -P / 2>/dev/null | awk 'NR==2 {gsub("%","",$5); print $5}')
            avail=$(df -Ph / 2>/dev/null | awk 'NR==2 {print $4}')
            if [ -n "$usage" ]; then
              if [ "$usage" -ge 95 ]; then
                fail "디스크 사용률이 ${usage}% 입니다(남은 공간 ${avail}). 배포가 실패할 수 있습니다."
              elif [ "$usage" -ge 85 ]; then
                warn "디스크 사용률이 ${usage}% 입니다(남은 공간 ${avail})."
              else
                pass "디스크 여유가 충분합니다(사용률 ${usage}%, 남은 공간 ${avail})."
              fi
            fi

            if command -v free >/dev/null 2>&1; then
              info "메모리: $(free -m | awk '/^Mem:/ {print $2" MB 중 "$7" MB 사용 가능"}'), 스왑: $(free -m | awk '/^Swap:/ {print $2" MB"}')"
            fi

            echo
            echo "--- 80/443 포트 ---"
            # 포트를 쓰는 컨테이너가 "이 compose 폴더의 스택"인지 "다른 스택"인지 구분한다. 다른 스택이 쓰고 있으면
            # 이 폴더의 배포가 포트를 잡지 못해 충돌하므로, 기존 스택을 중지하거나 인계해야 한다.
            REAL_DIR=$(cd "$COMPOSE_DIR" 2>/dev/null && pwd -P || echo "$COMPOSE_DIR")
            ps_rows=""
            if [ "$DOCKER_OK" = "1" ]; then
              ps_rows=$(docker ps --format '{{.Names}}|{{.Ports}}|{{.Label "com.docker.compose.project"}}|{{.Label "com.docker.compose.project.working_dir"}}' 2>/dev/null || true)
            fi
            for port in 80 443; do
              mine=""
              foreign=""
              while IFS='|' read -r c_name c_ports c_project c_workdir; do
                [ -z "$c_name" ] && continue
                if printf '%s' "$c_ports" | grep -qE "(^|[^0-9])${port}->"; then
                  if [ "$c_workdir" = "$REAL_DIR" ] || [ "$c_workdir" = "$COMPOSE_DIR" ]; then
                    mine="$mine $c_name"
                  else
                    foreign="$foreign ${c_name}(프로젝트: ${c_project:-없음}, 폴더: ${c_workdir:-알 수 없음})"
                  fi
                fi
              done <<< "$ps_rows"
              if [ -n "$foreign" ]; then
                fail "${port}번 포트를 다른 compose 프로젝트의 컨테이너가 쓰고 있습니다:${foreign}. 이 폴더(${REAL_DIR})의 배포와 충돌합니다. 기존 스택을 중지하거나 정리해 인계해야 합니다."
              elif [ -n "$mine" ]; then
                pass "${port}번 포트는 이 compose 스택의 컨테이너(${mine# })가 쓰고 있습니다."
              else
                listening=""
                if command -v ss >/dev/null 2>&1; then
                  listening=$(ss -ltn 2>/dev/null | awk '{print $4}' | grep -E ":${port}\$" | head -1 || true)
                fi
                if [ -n "$listening" ]; then
                  warn "${port}번 포트가 docker 컨테이너가 아닌 프로세스에 점유돼 있습니다. 소유자를 확인하세요(예: sudo ss -ltnp)."
                else
                  info "${port}번 포트는 비어 있습니다(첫 배포 전이면 정상입니다)."
                fi
              fi
            done

            echo
            echo "--- 현재 배포 상태 ---"
            if [ -f "$COMPOSE_DIR/.last-successful-image-tag" ]; then
              info "마지막으로 성공한 배포 이미지: $(cat "$COMPOSE_DIR/.last-successful-image-tag")"
            else
              info "성공한 배포 기록이 없습니다(첫 배포 전이면 정상입니다)."
            fi
            if [ "$DOCKER_OK" = "1" ]; then
              running=$(docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' 2>/dev/null)
              if [ -n "$running" ]; then
                info "실행 중인 컨테이너:"
                echo "$running" | sed 's/^/        /'
              else
                info "실행 중인 컨테이너가 없습니다."
              fi
            fi

            echo
            echo "=== 결과: 실패 ${FAILS}개, 경고 ${WARNS}개 ==="
            if [ "$FAILS" -gt 0 ]; then
              echo "[FAIL] 항목을 고친 뒤 다시 실행하세요."
              exit 1
            fi
            if [ "$WARNS" -gt 0 ]; then
              echo "FAIL 은 없지만 경고가 ${WARNS}개 있습니다. 위의 [WARN] 을 읽고 판단하세요."
            fi
            echo "점검한 항목을 모두 통과했습니다. 이 점검은 서버의 기본 준비 상태만 봅니다(앱이 실제로 뜨는지는 배포와 스모크 테스트가 확인합니다)."

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 서버 점검: ${{ inputs.environment }}"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ FAIL 없이 끝났습니다. 경고([WARN])와 80/443 포트 점유 안내는 'Step 4. 서버 상태 점검' 로그에서 꼭 확인하세요."
            else
              echo "❌ 점검에 실패했습니다. 실패한 단계의 로그에서 [FAIL] 또는 오류 메시지를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
