server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: aics-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aics}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        jdbc:
          time_zone: Asia/Seoul
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

file:
   url: /cloud
   upload-path: ${FILE_UPLOAD_PATH:./cloud}
   secret-key: ${FILE_SECRET_KEY}
   disallowed-extensions: exe, bat, sh, cmd, js, html, jsp, php, asp, aspx, dll, so, ps1, vbs, msi, htaccess, phtml, jar, war

# SubmissionAdminFacade가 제출물 다운로드 URL을 만들 때 FileStorage(S3FileStorage) 빈이 필요하다
# (PR #111, KD3-147). aics-api와 동일하게 켜야 한다 — 안 그러면 S3FileStorage 자체가
# 안 만들어져서(@ConditionalOnProperty) 부팅이 실패한다.
aws:
  s3:
    enabled: true
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: false

jwt:
  issuer: ${JWT_ISSUER}
  secret_key: ${JWT_SECRET_KEY}

docs:
  admin-docs-url: ${ADMIN_DOCS_URL:http://localhost:8081/swagger-ui/index.html}
  api-docs-url: ${API_DOCS_URL:http://localhost:8080/swagger-ui/index.html}
  auth-docs-url: ${AUTH_DOCS_URL:http://localhost:8082/swagger-ui/index.html}