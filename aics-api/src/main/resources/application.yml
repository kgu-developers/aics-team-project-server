server:
  port: 8080
  forward-headers-strategy: framework

# KD3-168: docker logs는 컨테이너가 지워지면 같이 사라진다(컨테이너 이름충돌 장애 때 실제로 겪음).
# 컨테이너 밖(호스트) 디렉토리에 마운트해서 컨테이너 수명과 무관하게 남긴다(docker-compose.yml 참고).
# total-size-cap으로 디스크를 무한정 잡아먹지 않게 상한을 둔다(디스크 꽉참 장애 재발 방지).
logging:
  file:
    name: /app/logs/aics-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

spring:
  application:
    name: aics-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aics}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        jdbc:
          time_zone: Asia/Seoul
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

file:
  secret-key: ${FILE_SECRET_KEY}

aws:
  s3:
    enabled: true
    region: ${AWS_S3_REGION:ap-northeast-2}
    # 버킷이 아직 없는 로컬/CI에서도 부팅은 되도록 기본값을 비워둔다 —
    # 실제 업로드를 시도할 때만(버킷 필요한 시점) 에러가 남.
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: API (aics-api)
        url: /v3/api-docs
      - name: Admin (aics-admin)
        url: /admin-api-docs
      - name: Auth (aics-auth)
        url: /auth-api-docs
  api-docs:
    enabled: false

jwt:
  issuer: ${JWT_ISSUER}
  secret_key: ${JWT_SECRET_KEY}
  access-token-validity: PT30M
  refresh-token-validity: P14D
