server:
  port: 8082
  forward-headers-strategy: framework

# KD3-168 참고: aics-api/application.yml 주석 참고 — 이유 동일.
logging:
  file:
    name: /app/logs/aics-auth.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

spring:
  application:
    name: aics-auth

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aics}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # KD3-303: 배포 서버가 총 메모리 911MB짜리 소형 인스턴스라, 커넥션풀 기본값(앱당 10개,
    # 유휴여도 그대로 유지)을 3개 앱이 각각 쓰면 postgres 유휴 커넥션 30개가 메모리 377MB를
    # 그대로 점유해버린다(실측, 스왑 1.3GB까지 쓰는 원인). 지금 트래픽 수준엔 과한 설정이라 낮춘다.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

file:
  secret-key: ${FILE_SECRET_KEY}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: false

jwt:
  issuer: ${JWT_ISSUER}
  secret_key: ${JWT_SECRET_KEY}
  access-token-validity: PT30M
  refresh-token-validity: P14D
