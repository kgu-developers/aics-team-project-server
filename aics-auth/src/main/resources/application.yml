server:
  port: 8082
  forward-headers-strategy: framework

# KD3-168 참고: aics-api/application.yml 주석 참고 — 이유 동일.
logging:
  file:
    name: /app/logs/aics-auth.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

spring:
  application:
    name: aics-auth

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aics}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # KD3-303: 배포 서버가 총 메모리 911MB짜리 소형 인스턴스라, 커넥션풀 기본값(앱당 10개,
    # 유휴여도 그대로 유지)을 3개 앱이 각각 쓰면 postgres 유휴 커넥션 30개가 메모리 377MB를
    # 그대로 점유해버린다(실측, 스왑 1.3GB까지 쓰는 원인). 지금 트래픽 수준엔 과한 설정이라 낮춘다.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

file:
  secret-key: ${FILE_SECRET_KEY}

# KD3-309: scanBasePackages가 "kgu.developers"라 aics-admin/aics-api와 동일하게
# 공유 도메인 전체를 스캔하므로, SectionAnnouncementCommandService(KD3-301에서
# FileStorage 의존성이 추가됨)도 여기서 빈 생성 대상이 된다. S3FileStorage는
# @ConditionalOnProperty(aws.s3.enabled)라 이 설정이 없으면 FileStorage 빈 자체가
# 안 만들어져 부팅이 실패한다(KD3-147 때 aics-admin에서 겪은 것과 같은 패턴).
# aics-api/aics-admin과 동일하게 켠다.
aws:
  s3:
    enabled: true
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: false

jwt:
  issuer: ${JWT_ISSUER}
  secret_key: ${JWT_SECRET_KEY}
  access-token-validity: PT30M
  refresh-token-validity: P14D
